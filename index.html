<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyaan Lodewyk - Cricket Stats Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --table-header-bg: #1e293b;
    }

    *, ::before, ::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .kpis {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
      min-width: 110px;
      flex: 1;
    }

    .kpi b {
      display: block;
      font-size: 22px;
      color: var(--accent);
    }

    .kpi span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      color: var(--accent);
    }

    .scroll {
      max-height: 500px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--card);
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover td {
      background: #283548;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    th.num {
      text-align: right;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 16px;
      color: var(--muted);
    }

    .error-msg {
      color: #f87171;
      text-align: center;
      padding: 20px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Keyaan Lodewyk</h1>
      <div class="sub">Wicket Keeper | Right Hand Batter (Top Order) | Right Arm Off Spin</div>
      
      <div class="kpis">
        <div class="kpi"><b id="kpi-matches">0</b><span>Matches</span></div>
        <div class="kpi"><b id="kpi-runs">0</b><span>Runs</span></div>
        <div class="kpi"><b id="kpi-avg">0.00</b><span>Avg</span></div>
        <div class="kpi"><b id="kpi-hs">0</b><span>Highest Score</span></div>
      </div>
    </header>

    <div id="loading" class="loading">Loading CricClubs match statistics...</div>

    <div id="content" style="display: none;">
      <section>
        <h2>Match Logs</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Opponent</th>
                <th class="num">Runs</th>
                <th>Dismissal / How Out</th>
                <th>Match ID</th>
              </tr>
            </thead>
            <tbody id="match-table-body">
              <!-- Dynamically populated via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <footer>Source: CricClubs network exports (`keyaan_cricclubs_stats.json`)</footer>
  </div>

  <script>
    /**
     * Recursively traverses object structures to discover and extract all match logs
     */
    function extractMatchLogs(data) {
      const matchMap = new Map();

      function traverse(obj) {
        if (!obj || typeof obj !== 'object') return;

        const date = obj.matchDate || obj.date || obj.MatchDate || obj.Date;
        const opponent = obj.opponentTeam || obj.vs || obj.opponent || obj.Opponent || obj.OpponentTeam || obj.team;
        const runsRaw = obj.runs ?? obj.runsScored ?? obj.Runs ?? obj.RunsScored ?? obj.r;
        const matchId = obj.matchId || obj.id || obj.MatchID || null;

        if (date || opponent || matchId) {
          const runs = runsRaw !== undefined && runsRaw !== null ? Number(runsRaw) : 0;
          const key = matchId ? `id_${matchId}` : `${date}_${opponent}`;

          if (date && opponent && !matchMap.has(key)) {
            matchMap.set(key, {
              date: date,
              opponent: opponent,
              runs: runs,
              dismissedBy: obj.dismissedBy || obj.howOut || obj.dismissal || obj.status || obj.out || 'Did Not Bat / Undefined',
              matchId: matchId || 'N/A'
            });
          }
        }

        if (Array.isArray(obj)) {
          obj.forEach(item => traverse(item));
        } else {
          Object.values(obj).forEach(val => traverse(val));
        }
      }

      traverse(data);
      return Array.from(matchMap.values());
    }

    async function initDashboard() {
      const loadingEl = document.getElementById('loading');
      const contentEl = document.getElementById('content');

      try {
        const response = await fetch('./keyaan_cricclubs_stats.json');
        if (!response.ok) {
          throw new Error(`Failed to load keyaan_cricclubs_stats.json (${response.status} ${response.statusText})`);
        }

        const data = await response.json();
        const matches = extractMatchLogs(data);

        if (matches.length === 0) {
          loadingEl.innerHTML = 'No match records found in keyaan_cricclubs_stats.json.';
          return;
        }

        // Sort matches chronologically (newest first)
        matches.sort((a, b) => new Date(b.date) - new Date(a.date));

        let totalRuns = 0;
        let highestScore = 0;
        let dismissalCount = 0;

        const tableBody = document.getElementById('match-table-body');
        tableBody.innerHTML = '';

        matches.forEach(match => {
          totalRuns += match.runs;
          if (match.runs > highestScore) {
            highestScore = match.runs;
          }

          const status = match.dismissedBy.toLowerCase();
          const isNotOut = status.includes('not out') || status.includes('did not bat');
          if (!isNotOut) {
            dismissalCount++;
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${match.date}</td>
            <td>${match.opponent}</td>
            <td class="num"><strong>${match.runs}</strong></td>
            <td>${match.dismissedBy}</td>
            <td>${match.matchId}</td>
          `;
          tableBody.appendChild(tr);
        });

        const totalMatches = matches.length;
        const avg = dismissalCount > 0 ? (totalRuns / dismissalCount).toFixed(2) : totalRuns.toFixed(2);

        // Update KPIs
        document.getElementById('kpi-matches').textContent = totalMatches;
        document.getElementById('kpi-runs').textContent = totalRuns;
        document.getElementById('kpi-hs').textContent = highestScore;
        document.getElementById('kpi-avg').textContent = avg;

        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

      } catch (err) {
        console.error(err);
        loadingEl.innerHTML = `<div class="error-msg">Error loading dashboard: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
