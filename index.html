<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyaan Lodewyk - CricClubs Career Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Top Navigation -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500 text-slate-950 p-2 rounded-lg font-bold text-xl">
          <i class="fa-solid fa-cricket-bat-ball"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">CricClubs <span class="text-emerald-400">Player Tracker</span></h1>
          <p class="text-xs text-slate-400">Live Career & Tournament Hub</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchLiveData()" class="px-3 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-sm flex items-center gap-2 transition">
          <i class="fa-solid fa-rotate" id="refreshIcon"></i> Sync CricClubs Data
        </button>
        <button onclick="toggleSettingsModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm flex items-center gap-2 transition">
          <i class="fa-solid fa-user-gear text-emerald-400"></i> Settings
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Player Profile Summary Card -->
    <section class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
        
        <!-- User Info -->
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center text-emerald-400 text-2xl font-bold">
            KL
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 id="playerName" class="text-2xl font-bold">Keyaan Lodewyk</h2>
              <span id="playerIDTag" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">ID: 4493684</span>
            </div>
            <p id="playerClub" class="text-slate-400 text-sm">Bryneven Primary / CG Lions • All-Rounder</p>
          </div>
        </div>

        <!-- Career Stats Aggregated from 120+ Games -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full md:w-auto">
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400 block">Total Matches</span>
            <span id="statMatches" class="text-xl font-bold text-emerald-400">120</span>
          </div>
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400 block">Total Runs</span>
            <span id="statRuns" class="text-xl font-bold text-white">2,480</span>
          </div>
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400 block">Total Wickets</span>
            <span id="statWickets" class="text-xl font-bold text-emerald-400">94</span>
          </div>
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400 block">High Score</span>
            <span id="statAvg" class="text-xl font-bold text-white">84*</span>
          </div>
        </div>

      </div>
    </section>

    <!-- Controls: Status Filter, Tournament Dropdown, Search -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      
      <!-- Status Tabs -->
      <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 w-full md:w-auto">
        <button onclick="filterMatches('all')" id="btn-all" class="px-4 py-1.5 text-sm rounded-lg bg-emerald-500 text-slate-950 font-medium">All Matches (120)</button>
        <button onclick="filterMatches('live')" id="btn-live" class="px-4 py-1.5 text-sm rounded-lg text-slate-400 hover:text-white">Live</button>
        <button onclick="filterMatches('completed')" id="btn-completed" class="px-4 py-1.5 text-sm rounded-lg text-slate-400 hover:text-white">Completed</button>
      </div>

      <!-- Filters & Search -->
      <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
        <!-- Tournament Dropdown -->
        <select id="tournamentFilter" onchange="renderMatches()" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400">
          <option value="ALL">All Tournaments</option>
          <option value="Montrose Night Challenge">Montrose Night Challenge</option>
          <option value="Primary Schools Colts">Primary Schools Colts</option>
          <option value="Central Gauteng Indoor IPT">Central Gauteng Indoor IPT</option>
          <option value="Far North Primary League">Far North Primary League</option>
        </select>

        <input type="text" id="searchInput" oninput="renderMatches()" placeholder="Search opponent, venue..." class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm
