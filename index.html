<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Stats Dashboard</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #1b5e20;
      --border-color: #dddddd;
      --table-header-bg: #e8f5e9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 5px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      text-align: center;
    }

    .stat-box {
      padding: 10px;
      background: var(--bg-color);
      border-radius: 6px;
    }

    .stat-box .number {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .stat-box .label {
      font-size: 0.85rem;
      color: #666;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--table-header-bg);
      color: var(--accent-color);
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: #666;
    }

    .error-msg {
      color: #d32f2f;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Cricket Career Overview</h1>
      <p>Match-by-Match Statistics & Records</p>
    </header>

    <div id="loading" class="loading">Loading statistics...</div>

    <div id="content" style="display: none;">
      <!-- Career Overview Card -->
      <div class="card">
        <h2>Career Summary</h2>
        <div class="summary-grid">
          <div class="stat-box">
            <div id="total-matches" class="number">0</div>
            <div class="label">Matches</div>
          </div>
          <div class="stat-box">
            <div id="total-runs" class="number">0</div>
            <div class="label">Total Runs</div>
          </div>
          <div class="stat-box">
            <div id="highest-score" class="number">0</div>
            <div class="label">Highest Score</div>
          </div>
          <div class="stat-box">
            <div id="batting-avg" class="number">0.00</div>
            <div class="label">Average</div>
          </div>
        </div>
      </div>

      <!-- Match Logs Table -->
      <div class="card">
        <h2>Match Logs</h2>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>Runs</th>
              <th>Dismissal / Status</th>
              <th>Match ID</th>
            </tr>
          </thead>
          <tbody id="match-table-body">
            <!-- Rows injected dynamically via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    /**
     * Traverses key structures and nested nodes in CricClubs stats JSON
     * to extract all available match entries.
     */
    function extractMatchLogs(data) {
      const matchMap = new Map();

      function traverse(obj) {
        if (!obj || typeof obj !== 'object') return;

        // Common key lookup for CricClubs properties
        const date = obj.matchDate || obj.date || obj.MatchDate || obj.Date;
        const opponent = obj.opponentTeam || obj.vs || obj.opponent || obj.Opponent || obj.OpponentTeam || obj.team;
        const runsRaw = obj.runs ?? obj.runsScored ?? obj.Runs ?? obj.RunsScored ?? obj.r;
        const matchId = obj.matchId || obj.id || obj.MatchID || null;

        // Check if current node is a match log entry
        if (date || opponent || matchId) {
          const runs = runsRaw !== undefined && runsRaw !== null ? Number(runsRaw) : 0;
          const key = matchId ? `id_${matchId}` : `${date}_${opponent}`;

          if (date && opponent && !matchMap.has(key)) {
            matchMap.set(key, {
              date: date,
              opponent: opponent,
              runs: runs,
              dismissedBy: obj.dismissedBy || obj.howOut || obj.dismissal || obj.status || obj.out || 'Did Not Bat / Undefined',
              matchId: matchId || 'N/A'
            });
          }
        }

        // Recursively walk through arrays and sub-objects
        if (Array.isArray(obj)) {
          obj.forEach(item => traverse(item));
        } else {
          Object.values(obj).forEach(val => traverse(val));
        }
      }

      traverse(data);
      return Array.from(matchMap.values());
    }

    /**
     * Fetches keyaan_cricclubs_stats.json and populates dashboard
     */
    async function initDashboard() {
      const loadingEl = document.getElementById('loading');
      const contentEl = document.getElementById('content');

      try {
        const response = await fetch('./keyaan_cricclubs_stats.json');
        if (!response.ok) {
          throw new Error(`Failed to load keyaan_cricclubs_stats.json: ${response.statusText}`);
        }

        const data = await response.json();
        const matches = extractMatchLogs(data);

        if (matches.length === 0) {
          loadingEl.innerHTML = 'No match records found in keyaan_cricclubs_stats.json.';
          return;
        }

        // Sort matches chronologically (newest first)
        matches.sort((a, b) => new Date(b.date) - new Date(a.date));

        // Calculate career aggregate stats
        let totalRuns = 0;
        let highestScore = 0;
        let dismissalCount = 0;

        const tableBody = document.getElementById('match-table-body');
        tableBody.innerHTML = '';

        matches.forEach(match => {
          totalRuns += match.runs;
          if (match.runs > highestScore) {
            highestScore = match.runs;
          }

          const status = match.dismissedBy.toLowerCase();
          const isNotOut = status.includes('not out') || status.includes('did not bat');
          if (!isNotOut) {
            dismissalCount++;
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${match.date}</td>
            <td>${match.opponent}</td>
            <td><strong>${match.runs}</strong></td>
            <td>${match.dismissedBy}</td>
            <td>${match.matchId}</td>
          `;
          tableBody.appendChild(tr);
        });

        const totalMatches = matches.length;
        const avg = dismissalCount > 0 ? (totalRuns / dismissalCount).toFixed(2) : totalRuns.toFixed(2);

        // Render Summary Cards
        document.getElementById('total-matches').textContent = totalMatches;
        document.getElementById('total-runs').textContent = totalRuns;
        document.getElementById('highest-score').textContent = highestScore;
        document.getElementById('batting-avg').textContent = avg;

        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

      } catch (err) {
        console.error(err);
        loadingEl.innerHTML = `<div class="error-msg">Error loading dashboard: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
