<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CricClubs Player Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Top Navigation -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500 text-slate-950 p-2 rounded-lg font-bold text-xl">
          <i class="fa-solid fa-cricket-bat-ball"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">CricClubs <span class="text-emerald-400">Player Tracker</span></h1>
          <p class="text-xs text-slate-400">Personal Performance & Match Hub</p>
        </div>
      </div>
      <button onclick="toggleSettingsModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm flex items-center gap-2 transition">
        <i class="fa-solid fa-user-gear text-emerald-400"></i> Change Player ID
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Player Profile Summary Card -->
    <section class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
        
        <!-- User Info -->
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center text-emerald-400 text-2xl font-bold">
            JD
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 id="playerName" class="text-2xl font-bold">John Doe</h2>
              <span id="playerIDTag" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">ID: CC-84920</span>
            </div>
            <p id="playerClub" class="text-slate-400 text-sm">Atlanta Strikers CC • All-Rounder</p>
          </div>
        </div>

        <!-- Quick Stats Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full md:w-auto">
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400 block">Matches</span>
            <span id="statMatches" class="text-xl font-bold text-emerald-400">24</span>
          </div>
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400 block">Runs</span>
            <span id="statRuns" class="text-xl font-bold text-white">582</span>
          </div>
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400 block">Wickets</span>
            <span id="statWickets" class="text-xl font-bold text-emerald-400">18</span>
          </div>
          <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400 block">Batting Avg</span>
            <span id="statAvg" class="text-xl font-bold text-white">32.3</span>
          </div>
        </div>

      </div>
    </section>

    <!-- Filters & Search -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 w-full sm:w-auto">
        <button onclick="filterMatches('all')" id="btn-all" class="px-4 py-1.5 text-sm rounded-lg bg-emerald-500 text-slate-950 font-medium">All User Matches</button>
        <button onclick="filterMatches('live')" id="btn-live" class="px-4 py-1.5 text-sm rounded-lg text-slate-400 hover:text-white">Live Now</button>
        <button onclick="filterMatches('completed')" id="btn-completed" class="px-4 py-1.5 text-sm rounded-lg text-slate-400 hover:text-white">Completed</button>
      </div>

      <input type="text" id="searchInput" oninput="renderMatches()" placeholder="Search opponent or league..." class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm w-full sm:w-64 focus:outline-none focus:border-emerald-400" />
    </div>

    <!-- Match List Grid -->
    <div id="matchContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Dynamic match cards will load here -->
    </div>

  </main>

  <!-- Player Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-id-card text-emerald-400"></i> Configure CricClubs Player
      </h3>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">CricClubs Player ID / Name</label>
          <input type="text" id="inputPlayerID" value="John Doe (CC-84920)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-emerald-400" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Club / Team Name</label>
          <input type="text" id="inputClub" value="Atlanta Strikers CC" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-emerald-400" />
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleSettingsModal()" class="px-4 py-2 rounded-xl text-sm bg-slate-700 hover:bg-slate-600">Cancel</button>
        <button onclick="savePlayerSettings()" class="px-4 py-2 rounded-xl text-sm bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold">Save & Refresh</button>
      </div>
    </div>
  </div>

  <script>
    // Sample CricClubs matches associated with John Doe
    const userMatches = [
      {
        id: 101,
        league: "Georgia Cricket League T20",
        date: "Today",
        status: "LIVE",
        teamA: "Atlanta Strikers CC",
        scoreA: "148/4 (17.2 ov)",
        teamB: "Savannah Kings CC",
        scoreB: "145/8 (20.0 ov)",
        userContribution: "John Doe: 42* (24) & 1/22 (4 ov)",
        result: "Atlanta Strikers CC need 2 runs in 16 balls"
      },
      {
        id: 102,
        league: "Georgia Premier League",
        date: "Oct 24, 2026",
        status: "COMPLETED",
        teamA: "Atlanta Strikers CC",
        scoreA: "182/6 (20.0 ov)",
        teamB: "Metro Bulls CC",
        scoreB: "154/9 (20.0 ov)",
        userContribution: "John Doe: 68 (38) [Player of the Match]",
        result: "Atlanta Strikers won by 28 runs"
      },
      {
        id: 103,
        league: "Fall T20 Cup",
        date: "Oct 17, 2026",
        status: "COMPLETED",
        teamA: "Alpharetta Lions",
        scoreA: "135/10 (18.4 ov)",
        teamB: "Atlanta Strikers CC",
        scoreB: "138/3 (16.1 ov)",
        userContribution: "John Doe: 3/15 (4.0 ov)",
        result: "Atlanta Strikers won by 7 wickets"
      }
    ];

    let currentFilter = 'all';

    function renderMatches() {
      const container = document.getElementById('matchContainer');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = userMatches.filter(m => {
        const matchesFilter = currentFilter === 'all' || m.status.toLowerCase() === currentFilter;
        const matchesSearch = m.league.toLowerCase().includes(search) || m.teamA.toLowerCase().includes(search) || m.teamB.toLowerCase().includes(search);
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-500">No matches found for this user.</div>`;
        return;
      }

      container.innerHTML = filtered.map(m => `
        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700 hover:border-slate-600 transition space-y-3">
          <div class="flex justify-between items-center text-xs text-slate-400">
            <span>${m.league}</span>
            <span class="px-2 py-0.5 rounded ${m.status === 'LIVE' ? 'bg-red-500/20 text-red-400 border border-red-500/30 font-bold' : 'bg-slate-700 text-slate-300'}">
              ${m.status === 'LIVE' ? '• LIVE' : m.date}
            </span>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center font-semibold">
              <span class="${m.teamA.includes('Atlanta') ? 'text-emerald-400 font-bold' : ''}">${m.teamA}</span>
              <span>${m.scoreA}</span>
            </div>
            <div class="flex justify-between items-center font-semibold">
              <span class="${m.teamB.includes('Atlanta') ? 'text-emerald-400 font-bold' : ''}">${m.teamB}</span>
              <span>${m.scoreB}</span>
            </div>
          </div>

          <!-- Highlight User's Individual Performance -->
          <div class="bg-slate-900/80 rounded-lg p-2.5 border border-emerald-500/20 flex items-center gap-2 text-xs text-emerald-300">
            <i class="fa-solid fa-star text-amber-400"></i>
            <span><strong>My Stats:</strong> ${m.userContribution}</span>
          </div>

          <p class="text-xs text-slate-400 italic">${m.result}</p>
        </div>
      `).join('');
    }

    function filterMatches(type) {
      currentFilter = type;
      ['all', 'live', 'completed'].forEach(t => {
        const btn = document.getElementById(`btn-${t}`);
        if (t === type) {
          btn.className = "px-4 py-1.5 text-sm rounded-lg bg-emerald-500 text-slate-950 font-medium";
        } else {
          btn.className = "px-4 py-1.5 text-sm rounded-lg text-slate-400 hover:text-white";
        }
      });
      renderMatches();
    }

    function toggleSettingsModal() {
      document.getElementById('settingsModal').classList.toggle('hidden');
      document.getElementById('settingsModal').classList.toggle('flex');
    }

    function savePlayerSettings() {
      const name = document.getElementById('inputPlayerID').value;
      const club = document.getElementById('inputClub').value;
      if (name) document.getElementById('playerName').innerText = name.split('(')[0].trim();
      if (club) document.getElementById('playerClub').innerText = club;
      toggleSettingsModal();
    }

    // Initial Render
    renderMatches();
  </script>
</body>
</html>
