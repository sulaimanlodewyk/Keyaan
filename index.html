<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyaan Lodewyk - Cricket Statistics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header / Profile Bar -->
  <header class="bg-slate-800 border-b border-slate-700 p-6 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-2xl font-bold text-white shadow-lg">
          KL
        </div>
        <div>
          <h1 id="player-name" class="text-2xl font-extrabold text-white tracking-wide">Keyaan Lodewyk</h1>
          <p id="player-role" class="text-sm text-slate-400">Loading profile...</p>
        </div>
      </div>
      <button onclick="loadStats()" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-xs font-semibold text-slate-200 transition">
        <i id="refresh-icon" class="fa-solid fa-arrows-rotate"></i> Refresh Data
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <main class="max-w-6xl mx-auto p-6 space-y-6">
    <div class="flex border-b border-slate-700 gap-2 pb-2">
      <button id="btn-overview" onclick="switchView('overview')" class="px-4 py-2 rounded-md font-medium transition text-sm bg-emerald-500 text-white">
        Overview
      </button>
      <button id="btn-series" onclick="switchView('series')" class="px-4 py-2 rounded-md font-medium transition text-sm text-slate-400 hover:text-white">
        Series Breakdown
      </button>
      <button id="btn-matches" onclick="switchView('matches')" class="px-4 py-2 rounded-md font-medium transition text-sm text-slate-400 hover:text-white">
        Match Logs
      </button>
    </div>

    <!-- Main Content Container -->
    <div id="contentContainer" class="space-y-6">
      <div class="text-center py-12 text-slate-400">Loading data...</div>
    </div>
  </main>

  <!-- JavaScript Logic -->
  <script>
    let activeView = 'overview';
    let appData = null;

    async function loadStats() {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('fa-spin');

      try {
        const response = await fetch(`./keyaan_cricclubs_stats.json?t=${new Date().getTime()}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        appData = await response.json();

        if (appData.player) {
          document.getElementById('player-name').innerText = appData.player.name || "Keyaan Lodewyk";
          document.getElementById('player-role').innerText = `${appData.player.playerRole} · ${appData.player.battingStyle} · #${appData.player.jerseyNumber}`;
        }

        renderContent();
      } catch (err) {
        console.error("Error loading JSON:", err);
        document.getElementById('contentContainer').innerHTML = `
          <div class="bg-rose-900/30 border border-rose-500/50 p-6 rounded-xl text-center text-rose-300">
            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
            <p class="font-semibold">Unable to load stats.json</p>
          </div>
        `;
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
      }
    }

    function switchView(view) {
      activeView = view;
      ['overview', 'series', 'matches'].forEach(v => {
        const btn = document.getElementById(`btn-${v}`);
        if (btn) {
          btn.className = (v === view) 
            ? "px-4 py-2 rounded-md font-medium transition text-sm bg-emerald-500 text-white" 
            : "px-4 py-2 rounded-md font-medium transition text-sm text-slate-400 hover:text-white";
        }
      });
      renderContent();
    }

    function extractMatchLogs(data) {
      const matchList = [];
      const seenMatches = new Set(); // To avoid duplicates across multiple arrays

      const addMatches = (arr) => {
        if (!Array.isArray(arr)) return;
        arr.forEach(m => {
          const date = m.matchDate || m.date || 'N/A';
          const opponent = m.opponentTeam || m.vs || m.opponent || 'N/A';
          const runs = m.runs ?? m.runsScored ?? '-';
          const key = `${date}_${opponent}_${runs}`;

          if (!seenMatches.has(key)) {
            seenMatches.add(key);
            matchList.push({
              date: date,
              opponent: opponent,
              runs: runs,
              dismissedBy: m.dismissedBy || 'Not Out / Undefined',
              matchId: m.matchId || 'N/A'
            });
          }
        });
      };

      // Aggregate matches from all matchWise keys in JSON
      if (data.matchWise && data.matchWise.battingStats) addMatches(data.matchWise.battingStats);
      if (data.lionsSchools && data.lionsSchools.matchWise) addMatches(data.lionsSchools.matchWise);
      if (data.super8EasterCup2026 && data.super8EasterCup2026.matchWise) addMatches(data.super8EasterCup2026.matchWise);
      if (data.steynCity && data.steynCity.matchWise) addMatches(data.steynCity.matchWise);
      if (data.ballistic && data.ballistic.matchWise) addMatches(data.ballistic.matchWise);

      // Check inside clubs array if present as array
      if (Array.isArray(data.clubs)) {
        data.clubs.forEach(c => {
          if (Array.isArray(c.matches)) addMatches(c.matches);
          if (Array.isArray(c.matchLogs)) addMatches(c.matchLogs);
        });
      }

      return matchList;
    }

    function renderContent() {
      if (!appData) return;

      const container = document.getElementById('contentContainer');
      const p = appData.player || {};

      let totalInnings = 0, totalFours = 0, totalSixes = 0, totalFifties = 0, totalHundreds = 0;
      let seriesList = [];

      if (appData.clubs) {
        appData.clubs.forEach(c => {
          (c.batting || []).forEach(b => {
            totalInnings += (b.innings || 0);
            totalFours += (b.fours || 0);
            totalSixes += (b.sixers || 0);
            totalFifties += (b.fifties || 0);
            totalHundreds += (b.hundreds || 0);

            seriesList.push({
              league: `${c.club} (${b.teamName})`,
              format: b.seriesType || 'T20',
              matches: b.matches || 0,
              runs: b.runsScored || 0,
              hs: b.highestScore || '-',
              avg: b.average || '-',
              sr: b.strikeRate || '-',
              fours: b.fours || 0,
              sixes: b.sixers || 0
            });
          });
        });
      }

      const matchList = extractMatchLogs(appData);

      if (activeView === 'overview') {
        container.innerHTML = `
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
              <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total Runs</span>
              <p class="text-3xl font-extrabold text-emerald-400 mt-1">${p.runs || 0}</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
              <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total Matches</span>
              <p class="text-3xl font-extrabold text-emerald-400 mt-1">${p.matches || 0}</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
              <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Current Team</span>
              <p class="text-xl font-bold text-emerald-400 mt-2 truncate">${p.currentTeam || 'Sandton Tigers'}</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
              <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Total Wickets</span>
              <p class="text-3xl font-extrabold text-emerald-400 mt-1">${p.wickets || 0}</p>
            </div>
          </div>

          <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 space-y-4">
            <h2 class="text-xl font-bold text-white">Career Highlights (${p.matches || 0} Matches)</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
              <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                <p class="text-2xl font-bold text-white">${totalInnings}</p>
                <p class="text-xs text-slate-400">Total Innings</p>
              </div>
              <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                <p class="text-2xl font-bold text-white">${totalHundreds} / ${totalFifties}</p>
                <p class="text-xs text-slate-400">100s / 50s Scored</p>
              </div>
              <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                <p class="text-2xl font-bold text-white">${totalFours}</p>
                <p class="text-xs text-slate-400">Boundaries (4s)</p>
              </div>
              <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                <p class="text-2xl font-bold text-white">${totalSixes}</p>
                <p class="text-xs text-slate-400">Sixes (6s)</p>
              </div>
            </div>
          </div>
        `;
      } else if (activeView === 'series') {
        container.innerHTML = `
          <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
            <div class="p-6 border-b border-slate-700">
              <h2 class="text-xl font-bold text-white">Complete Series & League Breakdown (${seriesList.length} Competitions)</h2>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                    <th class="p-4">Tournament / Club</th>
                    <th class="p-4 text-center">Format</th>
                    <th class="p-4 text-center">Matches</th>
                    <th class="p-4 text-center">Runs</th>
                    <th class="p-4 text-center">HS</th>
                    <th class="p-4 text-center">Avg</th>
                    <th class="p-4 text-center">SR</th>
                    <th class="p-4 text-center">4s / 6s</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-700 text-sm">
                  ${seriesList.map(s => `
                    <tr class="hover:bg-slate-700/30 transition">
                      <td class="p-4 font-semibold text-emerald-400">${s.league}</td>
                      <td class="p-4 text-center text-slate-400 text-xs">${s.format}</td>
                      <td class="p-4 text-center">${s.matches}</td>
                      <td class="p-4 text-center font-bold text-white">${s.runs}</td>
                      <td class="p-4 text-center">${s.hs}</td>
                      <td class="p-4 text-center">${s.avg}</td>
                      <td class="p-4 text-center">${s.sr}</td>
                      <td class="p-4 text-center">${s.fours} / ${s.sixes}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (activeView === 'matches') {
        container.innerHTML = `
          <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
            <div class="p-6 border-b border-slate-700">
              <h2 class="text-xl font-bold text-white">Individual Match Scores (${matchList.length} Matches Logged)</h2>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                    <th class="p-4">Date</th>
                    <th class="p-4">Opponent</th>
                    <th class="p-4 text-center">Runs Scored</th>
                    <th class="p-4 text-center">Dismissal Details</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-700 text-sm">
                  ${matchList.length > 0 ? matchList.map(m => `
                    <tr class="hover:bg-slate-700/30 transition">
                      <td class="p-4 text-slate-400 text-xs">${m.date}</td>
                      <td class="p-4 font-semibold text-emerald-400">${m.opponent}</td>
                      <td class="p-4 text-center font-bold text-white">${m.runs}</td>
                      <td class="p-4 text-center text-xs text-slate-300">${m.dismissedBy}</td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="4" class="p-6 text-center text-slate-400">
                        No individual match logs found in stats.json.
                      </td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadStats);
  </script>
</body>
</html>
