name: Auto Update Cricket Stats

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows you to run this manually anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Scraper Script
        run: python update_stats.py

      - name: Commit and Push if changes exist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add keyaan_cricclubs_stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cricket stats [skip ci]" && git push)
